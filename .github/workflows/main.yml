```yaml
name: Streaming Engine - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  streaming-engine:
    name: Setup and Test Streaming Engine
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Windows environment
        shell: powershell
        run: |
          Write-Host "=== Windows Environment ==="
          Write-Host "OS: $env:OS"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

      - name: Check Python
        shell: powershell
        run: |
          Write-Host "=== Python ==="
          python --version
          python -m pip --version

      - name: Upgrade pip
        shell: powershell
        run: |
          python -m pip install --upgrade pip

      - name: Install FFmpeg
        shell: powershell
        run: |
          Write-Host "=== Installing FFmpeg ==="
          choco install ffmpeg -y --no-progress

      - name: Verify FFmpeg
        shell: powershell
        run: |
          Write-Host "=== FFmpeg ==="
          ffmpeg -version

      - name: Install Python dependencies
        shell: powershell
        run: |
          if (Test-Path "requirements.txt") {
            Write-Host "Installing requirements.txt"
            python -m pip install -r requirements.txt
          }
          elseif (Test-Path "pyproject.toml") {
            Write-Host "Installing project from pyproject.toml"
            python -m pip install .
          }
          elseif (Test-Path "setup.py") {
            Write-Host "Installing project from setup.py"
            python -m pip install .
          }
          else {
            Write-Host "No Python dependency file found."
          }

      - name: Inspect project
        shell: powershell
        run: |
          Write-Host "=== Repository root ==="
          Get-ChildItem -Force

          Write-Host ""
          Write-Host "=== Python files ==="

          $pythonFiles = Get-ChildItem -Recurse -Filter *.py -File |
            Where-Object {
              $_.FullName -notmatch "\\.git\\" -and
              $_.FullName -notmatch "\\__pycache__\\" -and
              $_.FullName -notmatch "\\\.venv\\"
            }

          if ($pythonFiles) {
            $pythonFiles | ForEach-Object {
              Write-Host $_.FullName
            }
          }
          else {
            Write-Host "NO PYTHON FILES FOUND"
          }

      - name: Inspect project entry points
        shell: powershell
        run: |
          Write-Host "=== Searching for project entry points ==="

          $candidates = @(
            "main.py",
            "app.py",
            "run.py",
            "server.py",
            "streaming_engine.py"
          )

          $found = @()

          foreach ($candidate in $candidates) {
            $matches = Get-ChildItem -Recurse -Filter $candidate -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch "\\.git\\" -and
                $_.FullName -notmatch "\\__pycache__\\" -and
                $_.FullName -notmatch "\\\.venv\\"
              }

            foreach ($match in $matches) {
              $found += $match.FullName
              Write-Host "FOUND: $($match.FullName)"
            }
          }

          if ($found.Count -eq 0) {
            Write-Host "No standard entry point found."
          }

      - name: Run project diagnostic
        shell: powershell
        run: |
          Write-Host "=== Streaming Engine Diagnostic ==="

          $entryPoints = @(
            "main.py",
            "app.py",
            "run.py",
            "server.py",
            "streaming_engine.py"
          )

          $foundEntryPoint = $null

          foreach ($entry in $entryPoints) {
            $match = Get-ChildItem -Recurse -Filter $entry -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch "\\.git\\" -and
                $_.FullName -notmatch "\\__pycache__\\" -and
                $_.FullName -notmatch "\\\.venv\\"
              } |
              Select-Object -First 1

            if ($match) {
              $foundEntryPoint = $match.FullName
              break
            }
          }

          if ($null -eq $foundEntryPoint) {
            Write-Error "No supported Streaming Engine entry point was found."
            Write-Error "Expected one of: main.py, app.py, run.py, server.py, streaming_engine.py"
            exit 1
          }

          Write-Host "Entry point found:"
          Write-Host $foundEntryPoint

          Write-Host ""
          Write-Host "=== Running Python syntax check ==="
          python -m py_compile $foundEntryPoint

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python syntax check failed."
            exit 1
          }

          Write-Host "Python syntax check: PASS"

          Write-Host ""
          Write-Host "=== Attempting application help/diagnostic ==="

          python $foundEntryPoint --help

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Application does not provide --help or returned a non-zero status."
            Write-Host "Syntax check passed, but application diagnostic could not be confirmed."
          }
          else {
            Write-Host "Application diagnostic: PASS"
          }

      - name: Final status
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "Streaming Engine workflow completed"
          Write-Host "===================================="
```



  
