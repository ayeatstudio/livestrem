
name: Streaming Engine - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  streaming-engine:
    name: Setup and Test Streaming Engine
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show repository structure
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "        REPOSITORY STRUCTURE"
          Write-Host "========================================"

          Get-ChildItem -Force

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        ALL PROJECT FILES"
          Write-Host "========================================"

          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.FullName -notmatch "\\.git\\" -and
              $_.FullName -notmatch "\\__pycache__\\"
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Check Python
        shell: powershell
        run: |
          Write-Host "=== Python ==="
          python --version
          python -m pip --version

      - name: Upgrade pip
        shell: powershell
        run: |
          python -m pip install --upgrade pip

      - name: Install FFmpeg
        shell: powershell
        run: |
          Write-Host "=== Installing FFmpeg ==="
          choco install ffmpeg -y --no-progress

      - name: Verify FFmpeg
        shell: powershell
        run: |
          Write-Host "=== FFmpeg ==="
          ffmpeg -version

      - name: Install Python dependencies
        shell: powershell
        run: |
          if (Test-Path "requirements.txt") {
            Write-Host "Installing requirements.txt"
            python -m pip install -r requirements.txt
          }
          elseif (Test-Path "pyproject.toml") {
            Write-Host "Installing project from pyproject.toml"
            python -m pip install .
          }
          elseif (Test-Path "setup.py") {
            Write-Host "Installing project from setup.py"
            python -m pip install .
          }
          else {
            Write-Host "No dependency file found."
          }

      - name: Find Python project
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "        SEARCHING PYTHON PROJECT"
          Write-Host "========================================"

          $pythonFiles = Get-ChildItem -Recurse -Filter *.py -File |
            Where-Object {
              $_.FullName -notmatch "\\.git\\" -and
              $_.FullName -notmatch "\\__pycache__\\"
            }

          if ($pythonFiles.Count -eq 0) {
            Write-Error "NO PYTHON FILES FOUND IN REPOSITORY"
            exit 1
          }

          Write-Host ""
          Write-Host "Python files found:"
          $pythonFiles | ForEach-Object {
            Write-Host "PYTHON: $($_.FullName)"
          }

      - name: Detect application entry point
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "        DETECTING ENTRY POINT"
          Write-Host "========================================"

          $priorityNames = @(
            "main.py",
            "app.py",
            "run.py",
            "server.py",
            "streaming_engine.py",
            "launcher.py",
            "start.py"
          )

          $entryPoint = $null

          foreach ($name in $priorityNames) {
            $match = Get-ChildItem -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch "\\.git\\" -and
                $_.FullName -notmatch "\\__pycache__\\"
              } |
              Select-Object -First 1

            if ($match) {
              $entryPoint = $match.FullName
              break
            }
          }

          if ($null -eq $entryPoint) {
            Write-Host ""
            Write-Host "No standard entry point name found."
            Write-Host "Searching for Python files containing executable code..."

            $allPython = Get-ChildItem -Recurse -Filter *.py -File |
              Where-Object {
                $_.FullName -notmatch "\\.git\\" -and
                $_.FullName -notmatch "\\__pycache__\\"
              }

            foreach ($file in $allPython) {
              $content = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue

              if (
                $content -match "__main__" -or
                $content -match "ArgumentParser" -or
                $content -match "CustomTkinter" -or
                $content -match "customtkinter" -or
                $content -match "tkinter" -or
                $content -match "FastAPI" -or
                $content -match "Flask"
              ) {
                $entryPoint = $file.FullName
                Write-Host "Possible entry point found:"
                Write-Host $entryPoint
                break
              }
            }
          }

          if ($null -eq $entryPoint) {
            Write-Error "Could not automatically determine an application entry point."
            Write-Host ""
            Write-Host "The repository DOES contain Python files,"
            Write-Host "but no obvious launcher was detected."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ENTRY POINT:"
          Write-Host $entryPoint
          Write-Host "========================================"

          "ENTRY_POINT=$entryPoint" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Python syntax validation
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "        PYTHON SYNTAX CHECK"
          Write-Host "========================================"

          Write-Host "Checking:"
          Write-Host $env:ENTRY_POINT

          python -m py_compile "$env:ENTRY_POINT"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python syntax check FAILED."
            exit 1
          }

          Write-Host ""
          Write-Host "Python syntax check: PASS"

      - name: Run application diagnostic
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "     STREAMING ENGINE DIAGNOSTIC"
          Write-Host "========================================"

          Write-Host "Entry point:"
          Write-Host $env:ENTRY_POINT

          Write-Host ""
          Write-Host "Running application with --help..."

          python "$env:ENTRY_POINT" --help

          if ($LASTEXITCODE -eq 0) {
            Write-Host ""
            Write-Host "Application diagnostic: PASS"
          }
          else {
            Write-Host ""
            Write-Host "Application does not support --help."
            Write-Host "This is NOT automatically treated as a failure."
            Write-Host "Python syntax validation already passed."
          }

      - name: Final status
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "   STREAMING ENGINE CHECK COMPLETED"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Repository checkout: PASS"
          Write-Host "Python environment: PASS"
          Write-Host "FFmpeg: PASS"
          Write-Host "Python project detection: PASS"
          Write-Host "Syntax validation: PASS"
          Write-Host ""
          Write-Host "Streaming Engine CI diagnostic completed."
